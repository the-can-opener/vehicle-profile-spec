[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-profile-tools"
version = "2.2.0"
description = "Package validation and migration for Vehicle Binding format 2"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "rich-click>=1.8,<2", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "semantic-version>=2.10,<3"]

[project.scripts]
vprofile = "vehicle_profile_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML", "types-jsonschema", "build", "hatchling", "nox"]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_profile_tools"]
[tool.hatch.build.targets.wheel.force-include]
"../skills" = "vehicle_profile_tools/bundled_skills"
"../catalog/vss-6.1.json" = "vehicle_profile_tools/data/vss-6.1.json"
"../catalog/LICENSE" = "vehicle_profile_tools/data/VSS-LICENSE"
"../docs/vocabulary.yaml" = "vehicle_profile_tools/data/vocabulary.yaml"

[tool.ruff]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
